# GitHub Pages configuration.
#
# Purpose: publish PRIVACY.md at a stable public HTTPS URL, which the Chrome
# Web Store requires in the Developer Dashboard's privacy-policy field.
#
# Serving from the repository root (rather than copying the policy into a
# docs/ folder) deliberately keeps PRIVACY.md as the single source of truth -
# a duplicated copy is exactly how the policy drifted out of sync with the
# shipped build once already.
#
# To enable: GitHub repo > Settings > Pages > Source: "Deploy from a branch",
# Branch: main, Folder: / (root). The policy is then served at
# https://melismehmeti.github.io/japanese-immersion-tracker/PRIVACY.html
# Note that GitHub Pages on a free plan requires the repository to be public.

title: Language Immersion Tracker
description: Privacy policy and documentation for the Language Immersion Tracker Chrome extension.
theme: jekyll-theme-minimal

# Only the policy and readme are meant to be rendered as pages. Everything
# else in the repo is extension source, tests, or release artifacts.
include:
  - PRIVACY.md

exclude:
  - node_modules/
  - tests/
  - scripts/
  - release/
  - store-assets/
  - supabase/
  - config/
  - icons/
  - assets/
  - promopicutres/
  - background.js
  - content.js
  - popup.js
  - page-probe.js
  - manifest.json
  - package.json
  - package-lock.json
  - extension.zip
  - NEXT_PHASE_ROADMAP.md
  - TECHNICAL_FOUNDATION.md
  - STORE_LISTING.md
  - SUPABASE_SCHEMA_DRAFT.sql
